[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor Configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for N16R8 (16MB Flash, 8MB PSRAM)
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue

; Board configuration for N16R8 (16MB Flash, 8MB PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.psram_type = opi

; Library dependencies
lib_deps = 
    https://github.com/stm32duino/VL53L8CX.git
    sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.3
    adafruit/Adafruit NeoPixel@^1.12.0
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

; Upload configuration
upload_speed = 921600
upload_port = COM5

; Filesystem configuration for model storage
board_build.filesystem = littlefs
board_build.partitions = default.csv
